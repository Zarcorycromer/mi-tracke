<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguidor de Actividades Semanales</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #fff;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* --- NOTA CSS: Estilos de la sección del nombre --- */
        .user-section {
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .user-section.error-highlight {
            border-color: var(--danger-color);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        .user-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .user-input-group {
            display: flex;
            gap: 10px;
        }

        .user-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .user-input:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lock-timer {
            font-size: 0.78rem;
            color: var(--danger-color);
            margin-top: 8px;
            display: block;
        }

        /* --- NOTA CSS: Estilos de pestañas y barra de progreso --- */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background-color: var(--bg-color);
            padding: 6px;
            border-radius: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        .progress-container {
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: var(--bg-color);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--success-color);
            transition: width 0.3s ease;
        }

        /* --- NOTA CSS: Títulos de los Módulos / Materias --- */
        .materia-title {
            font-size: 1.05rem;
            color: var(--accent-color);
            margin-top: 20px;
            margin-bottom: 10px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
        }

        .materia-title:first-child {
            margin-top: 0;
        }

        /* --- NOTA CSS: Lista de Actividades --- */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .task-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            user-select: none;
            cursor: pointer;
        }

        .task-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .task-item:hover:not(.disabled) {
            border-color: #475569;
        }

        .task-checkbox {
            width: 18px;
            height: 18px;
            accent-color: var(--success-color);
            cursor: pointer;
            margin-right: 12px;
        }

        .task-checkbox:disabled {
            cursor: not-allowed;
        }

        .task-label {
            flex: 1;
            color: var(--text-main);
            font-size: 0.92rem;
        }

        .task-item.completed .task-label {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* --- NOTA CSS: Botones de limpieza --- */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-clear {
            flex: 1;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .reset-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Control de Actividades Semanales</h1>
        <p class="subtitle">Se reinicia automáticamente cada lunes</p>
    </header>

    <!-- NOTA HTML: Sección del nombre del estudiante -->
    <div class="user-section" id="user-box">
        <label class="user-label" for="username-input">Nombre del Usuario / Estudiante:</label>
        <div class="user-input-group">
            <input type="text" id="username-input" class="user-input" placeholder="Ingresa tu nombre para activar las tareas..." autocomplete="off">
            <button id="user-btn" class="btn" onclick="saveUsername()">Guardar</button>
        </div>
        <span id="lock-timer-text" class="lock-timer" style="display: none;"></span>
    </div>

    <!-- NOTA HTML: Pestañas para las 4 semanas -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchWeek(1)">Semana 1</button>
        <button class="tab-btn" onclick="switchWeek(2)">Semana 2</button>
        <button class="tab-btn" onclick="switchWeek(3)">Semana 3</button>
        <button class="tab-btn" onclick="switchWeek(4)">Semana 4</button>
    </div>

    <!-- NOTA HTML: Barra de Progreso -->
    <div class="progress-container">
        <div class="progress-header">
            <span>Progreso de la semana</span>
            <span id="progress-text">0 / 0 completadas</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
    </div>

    <!-- NOTA HTML: Aquí se dibujan automáticamente las materias y actividades -->
    <div class="task-list" id="task-list"></div>

    <!-- NOTA HTML: Botones para desmarcar actividades tachadas -->
    <div class="action-buttons">
        <button class="btn-clear" onclick="clearWeekTasks()">Borrar tachadas (Esta semana)</button>
        <button class="btn-clear" onclick="clearAllWeeksTasks()">Borrar tachadas (Las 4 semanas)</button>
    </div>

    <div class="reset-info">
        <span id="last-reset-text">Lunes activo: --</span>
    </div>
</div>

<script>
    // =========================================================================
    // 📌 MATERIAS OFICIALES DE TU PLAN DE ESTUDIOS
    // =========================================================================
    const MATERIAS = [
        {
            nombre: "Ética y Cultura Universitaria",
            actividades: [
                "Actividad 1",
                "Actividad 2",
                "Actividad 3",
            ]
        },
        {
            nombre: "Educación Física para la Salud y Deporte",
            actividades: [
                "Actividad 1",
                "Actividad 2",
                "Actividad 3",
            ]
        },
        {
            nombre: "Geometría Analítica",
            actividades: [
                "Actividad 1",
                "Actividad 2",
                "Actividad 3",
            ]
        },
        {
            nombre: "Identidad y Expresión Cultural",
            actividades: [
                "Actividad 1",
                "Actividad 2",
                "Actividad 3",
            ]
        },
        {
            nombre: "Matemática I",
            actividades: [
                "Actividad 1",
                "Actividad 2",
                "Actividad 3",
            ]
        },
        {
            nombre: "Lógica Matemática",
            actividades: [
                "Actividad 1",
                "Actividad 2",
                "Actividad 3",

            ]
        }
    ];
    // --- CONFIGURACIÓN DEL SISTEMA ---
    const TOTAL_WEEKS = 4;
    const LOCK_HOURS = 32;
    const LOCK_MS = LOCK_HOURS * 60 * 60 * 1000;

    let currentWeek = 1;

    // --- ESTADO INICIAL DEL ALMACENAMIENTO ---
    let appData = {
        username: "",
        usernameSavedTime: null,
        lastResetMonday: null,
        weeks: { 1: {}, 2: {}, 3: {}, 4: {} } // Guarda qué casilla está marcada por semana
    };

    function getMostRecentMonday() {
        const now = new Date();
        const day = now.getDay();
        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(now.setDate(diff));
        return monday.toISOString().split('T')[0];
    }

    function saveData() {
        localStorage.setItem('weekly_tracker_v4', JSON.stringify(appData));
    }

    function loadData() {
        const saved = localStorage.getItem('weekly_tracker_v4');
        if (saved) {
            try {
                appData = JSON.parse(saved);
            } catch(e) {
                console.error("Error al cargar los datos guardados");
            }
        }
        checkMondayReset();
        updateUserSection();
    }

    function checkMondayReset() {
        const currentMonday = getMostRecentMonday();

        if (!appData.lastResetMonday) {
            appData.lastResetMonday = currentMonday;
            saveData();
        } else if (appData.lastResetMonday !== currentMonday) {
            // Es un nuevo lunes -> Desmarcar todo
            appData.weeks = { 1: {}, 2: {}, 3: {}, 4: {} };
            appData.lastResetMonday = currentMonday;
            saveData();
        }

        document.getElementById('last-reset-text').innerText = `Lunes activo: ${appData.lastResetMonday}`;
    }

    // --- NOTA JS: Guardar y Bloquear el nombre durante 32 horas ---
    function saveUsername() {
        const input = document.getElementById('username-input');
        const val = input.value.trim();

        if (!val) {
            alert("Por favor ingresa un nombre válido.");
            return;
        }

        appData.username = val;
        appData.usernameSavedTime = Date.now();
        saveData();
        updateUserSection();
        renderTasks(); // Reactivar interacciones
    }

    function updateUserSection() {
        const input = document.getElementById('username-input');
        const btn = document.getElementById('user-btn');
        const timerText = document.getElementById('lock-timer-text');

        if (!appData.username) {
            input.value = "";
            input.disabled = false;
            btn.disabled = false;
            timerText.style.display = "none";
            return;
        }

        input.value = appData.username;
        const now = Date.now();
        const elapsed = now - (appData.usernameSavedTime || 0);

        if (elapsed < LOCK_MS) {
            input.disabled = true;
            btn.disabled = true;
            timerText.style.display = "block";
            
            const remaining = LOCK_MS - elapsed;
            const hours = Math.floor(remaining / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            timerText.innerText = `🔒 Bloqueado: Podrás editar tu nombre nuevamente en ${hours}h ${minutes}m.`;
        } else {
            input.disabled = false;
            btn.disabled = false;
            btn.innerText = "Actualizar";
            timerText.style.display = "none";
        }
    }

    /* Navegación entre las 4 semanas */
    function switchWeek(weekNum) {
        currentWeek = weekNum;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            if (idx + 1 === weekNum) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderTasks();
    }

    // --- NOTA JS: Dibuja los módulos y actividades en pantalla ---
    function renderTasks() {
        const container = document.getElementById('task-list');
        container.innerHTML = '';

        const hasUser = Boolean(appData.username && appData.username.trim() !== "");
        let totalCompleted = 0;
        let totalTasks = 0;

        MATERIAS.forEach((materia, mIdx) => {
            // Título del Módulo / Materia
            const mHeader = document.createElement('h3');
            mHeader.className = 'materia-title';
            mHeader.innerText = materia.nombre;
            container.appendChild(mHeader);

            // Actividades
            materia.actividades.forEach((actText, aIdx) => {
                totalTasks++;
                const taskId = `m${mIdx}_a${aIdx}`;
                const isCompleted = Boolean(appData.weeks[currentWeek] && appData.weeks[currentWeek][taskId]);
                
                if (isCompleted) totalCompleted++;

                const item = document.createElement('div');
                item.className = `task-item ${isCompleted ? 'completed' : ''} ${!hasUser ? 'disabled' : ''}`;
                
                item.onclick = (e) => {
                    if (!hasUser) {
                        promptRequireUser();
                        return;
                    }
                    if (e.target.tagName !== 'INPUT') {
                        toggleTask(taskId);
                    }
                };

                item.innerHTML = `
                    <input type="checkbox" class="task-checkbox" ${isCompleted ? 'checked' : ''} ${!hasUser ? 'disabled' : ''} onchange="toggleTask('${taskId}')">
                    <span class="task-label">${escapeHtml(actText)}</span>
                `;

                container.appendChild(item);
            });
        });

        // Actualizar porcentaje
        const percentage = totalTasks > 0 ? Math.round((totalCompleted / totalTasks) * 100) : 0;
        document.getElementById('progress-bar').style.width = `${percentage}%`;
        document.getElementById('progress-text').innerText = `${totalCompleted} / ${totalTasks} completadas`;
    }

    function promptRequireUser() {
        const box = document.getElementById('user-box');
        box.classList.add('error-highlight');
        document.getElementById('username-input').focus();
        alert("⚠️ Debes colocar y guardar tu nombre antes de poder tachar alguna actividad.");
        setTimeout(() => box.classList.remove('error-highlight'), 2000);
    }

    function toggleTask(taskId) {
        if (!appData.username || appData.username.trim() === "") {
            promptRequireUser();
            return;
        }

        if (!appData.weeks[currentWeek]) {
            appData.weeks[currentWeek] = {};
        }

        appData.weeks[currentWeek][taskId] = !appData.weeks[currentWeek][taskId];
        saveData();
        renderTasks();
    }

    // --- NOTA JS: Funciones de Limpieza ---
    function clearWeekTasks() {
        if (confirm(`¿Quieres desmarcar todas las tareas tachadas de la Semana ${currentWeek}?`)) {
            appData.weeks[currentWeek] = {};
            saveData();
            renderTasks();
        }
    }

    function clearAllWeeksTasks() {
        if (confirm(`¿Quieres desmarcar TODAS las actividades de las 4 semanas?`)) {
            appData.weeks = { 1: {}, 2: {}, 3: {}, 4: {} };
            saveData();
            renderTasks();
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Comprobación periódica para el reloj de 32h
    setInterval(updateUserSection, 60000);

    // Inicializar
    loadData();
    renderTasks();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguidor de Actividades Semanales</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --success-color: #22c55e;
            --danger-color: #ef4444;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
        }

        header {
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 6px;
            color: #fff;
        }

        p.subtitle {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        /* Sección de Nombre de Usuario */
        .user-section {
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: border-color 0.3s ease;
        }

        .user-section.error-highlight {
            border-color: var(--danger-color);
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);
        }

        .user-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .user-input-group {
            display: flex;
            gap: 10px;
        }

        .user-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .user-input:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn:hover:not(:disabled) {
            background-color: var(--accent-hover);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lock-timer {
            font-size: 0.78rem;
            color: var(--danger-color);
            margin-top: 8px;
            display: block;
        }

        /* Pestañas de Semanas */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background-color: var(--bg-color);
            padding: 6px;
            border-radius: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px 0;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--accent-color);
            color: #fff;
        }

        .tab-btn:hover:not(.active) {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
        }

        /* Progreso */
        .progress-container {
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: var(--bg-color);
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background-color: var(--success-color);
            transition: width 0.3s ease;
        }

        /* Lista de Tareas */
        .task-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .task-item {
            display: flex;
            align-items: center;
            background-color: var(--bg-color);
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            user-select: none;
            cursor: pointer;
        }

        .task-item.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .task-item:hover:not(.disabled) {
            border-color: #475569;
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            accent-color: var(--success-color);
            cursor: pointer;
            margin-right: 14px;
        }

        .task-checkbox:disabled {
            cursor: not-allowed;
        }

        .task-label {
            flex: 1;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .task-item.completed .task-label {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Botones de Borrado y Footer */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-clear {
            flex: 1;
            background-color: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-clear:hover {
            border-color: var(--danger-color);
            color: var(--danger-color);
        }

        .reset-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Control de Actividades Semanales</h1>
        <p class="subtitle">Se reinicia automáticamente cada lunes</p>
    </header>

    <!-- Usuario y Bloqueo de 32 Horas -->
    <div class="user-section" id="user-box">
        <label class="user-label" for="username-input">Nombre del Usuario / Estudiante:</label>
        <div class="user-input-group">
            <input type="text" id="username-input" class="user-input" placeholder="Ingresa tu nombre para comenzar..." autocomplete="off">
            <button id="user-btn" class="btn" onclick="saveUsername()">Guardar</button>
        </div>
        <span id="lock-timer-text" class="lock-timer" style="display: none;"></span>
    </div>

    <!-- Pestañas para las 4 semanas -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchWeek(1)">Semana 1</button>
        <button class="tab-btn" onclick="switchWeek(2)">Semana 2</button>
        <button class="tab-btn" onclick="switchWeek(3)">Semana 3</button>
        <button class="tab-btn" onclick="switchWeek(4)">Semana 4</button>
    </div>

    <!-- Barra de progreso de la semana activa -->
    <div class="progress-container">
        <div class="progress-header">
            <span>Progreso de la semana</span>
            <span id="progress-text">0 / 6 completadas</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
    </div>

    <!-- Lista de las 6 actividades -->
    <div class="task-list" id="task-list">
        <!-- Generado dinámicamente -->
    </div>

    <!-- Botones para desmarcar actividades tachadas -->
    <div class="action-buttons">
        <button class="btn-clear" onclick="clearWeekTasks()">Borrar tachadas (Esta semana)</button>
        <button class="btn-clear" onclick="clearAllWeeksTasks()">Borrar tachadas (Las 4 semanas)</button>
    </div>

    <!-- Footer / Info de Reajuste -->
    <div class="reset-info">
        <span id="last-reset-text">Lunes activo: --</span>
    </div>
</div>

<script>
    const TOTAL_WEEKS = 4;
    const TASKS_PER_WEEK = 6;
    const LOCK_HOURS = 32;
    const LOCK_MS = LOCK_HOURS * 60 * 60 * 1000;

    let currentWeek = 1;

    // Estado de la aplicación
    let appData = {
        username: "",
        usernameSavedTime: null,
        lastResetMonday: null,
        weeks: {
            1: Array.from({length: 6}, (_, i) => ({ text: `Actividad ${i+1}`, completed: false })),
            2: Array.from({length: 6}, (_, i) => ({ text: `Actividad ${i+1}`, completed: false })),
            3: Array.from({length: 6}, (_, i) => ({ text: `Actividad ${i+1}`, completed: false })),
            4: Array.from({length: 6}, (_, i) => ({ text: `Actividad ${i+1}`, completed: false }))
        }
    };

    function getMostRecentMonday() {
        const now = new Date();
        const day = now.getDay();
        const diff = now.getDate() - day + (day === 0 ? -6 : 1);
        const monday = new Date(now.setDate(diff));
        return monday.toISOString().split('T')[0];
    }

    function saveData() {
        localStorage.setItem('weekly_tracker_v3', JSON.stringify(appData));
    }

    function loadData() {
        const saved = localStorage.getItem('weekly_tracker_v3');
        if (saved) {
            try {
                appData = JSON.parse(saved);
            } catch(e) {
                console.error("Error al cargar los datos guardados");
            }
        }
        checkMondayReset();
        updateUserSection();
    }

    function checkMondayReset() {
        const currentMonday = getMostRecentMonday();

        if (!appData.lastResetMonday) {
            appData.lastResetMonday = currentMonday;
            saveData();
        } else if (appData.lastResetMonday !== currentMonday) {
            for (let w = 1; w <= TOTAL_WEEKS; w++) {
                appData.weeks[w].forEach(task => task.completed = false);
            }
            appData.lastResetMonday = currentMonday;
            saveData();
        }

        document.getElementById('last-reset-text').innerText = `Lunes activo: ${appData.lastResetMonday}`;
    }

    /* Nombre de Usuario y Regla de 32 Horas */
    function saveUsername() {
        const input = document.getElementById('username-input');
        const val = input.value.trim();

        if (!val) {
            alert("Por favor ingresa un nombre válido.");
            return;
        }

        appData.username = val;
        appData.usernameSavedTime = Date.now();
        saveData();
        updateUserSection();
        renderTasks(); // Reactivar casilla de tareas
    }

    function updateUserSection() {
        const input = document.getElementById('username-input');
        const btn = document.getElementById('user-btn');
        const timerText = document.getElementById('lock-timer-text');

        if (!appData.username) {
            input.value = "";
            input.disabled = false;
            btn.disabled = false;
            timerText.style.display = "none";
            return;
        }

        input.value = appData.username;
        const now = Date.now();
        const elapsed = now - (appData.usernameSavedTime || 0);

        if (elapsed < LOCK_MS) {
            input.disabled = true;
            btn.disabled = true;
            timerText.style.display = "block";
            
            const remaining = LOCK_MS - elapsed;
            const hours = Math.floor(remaining / (1000 * 60 * 60));
            const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
            timerText.innerText = `🔒 Bloqueado: Podrás editar tu nombre nuevamente en ${hours}h ${minutes}m.`;
        } else {
            input.disabled = false;
            btn.disabled = false;
            btn.innerText = "Actualizar";
            timerText.style.display = "none";
        }
    }

    /* Navegación */
    function switchWeek(weekNum) {
        currentWeek = weekNum;
        document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
            if (idx + 1 === weekNum) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        renderTasks();
    }

    /* Renderizado de tareas */
    function renderTasks() {
        const container = document.getElementById('task-list');
        container.innerHTML = '';

        const tasks = appData.weeks[currentWeek];
        let completedCount = 0;
        const hasUser = Boolean(appData.username && appData.username.trim() !== "");

        tasks.forEach((task, index) => {
            if (task.completed) completedCount++;

            const item = document.createElement('div');
            item.className = `task-item ${task.completed ? 'completed' : ''} ${!hasUser ? 'disabled' : ''}`;
            
            item.onclick = (e) => {
                if (!hasUser) {
                    promptRequireUser();
                    return;
                }
                if (e.target.tagName !== 'INPUT') {
                    toggleTask(index);
                }
            };

            item.innerHTML = `
                <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} ${!hasUser ? 'disabled' : ''} onchange="toggleTask(${index})">
                <span class="task-label">${escapeHtml(task.text)}</span>
            `;

            container.appendChild(item);
        });

        const percentage = Math.round((completedCount / TASKS_PER_WEEK) * 100);
        document.getElementById('progress-bar').style.width = `${percentage}%`;
        document.getElementById('progress-text').innerText = `${completedCount} / ${TASKS_PER_WEEK} completadas`;
    }

    function promptRequireUser() {
        const box = document.getElementById('user-box');
        box.classList.add('error-highlight');
        document.getElementById('username-input').focus();
        alert("⚠️ Debes colocar y guardar tu nombre antes de poder tachar alguna actividad.");
        setTimeout(() => box.classList.remove('error-highlight'), 2000);
    }

    function toggleTask(index) {
        if (!appData.username || appData.username.trim() === "") {
            promptRequireUser();
            return;
        }
        appData.weeks[currentWeek][index].completed = !appData.weeks[currentWeek][index].completed;
        saveData();
        renderTasks();
    }

    /* Botones de Borrado */
    function clearWeekTasks() {
        if (confirm(`¿Quieres desmarcar todas las tareas tachadas únicamente de la Semana ${currentWeek}?`)) {
            appData.weeks[currentWeek].forEach(task => task.completed = false);
            saveData();
            renderTasks();
        }
    }

    function clearAllWeeksTasks() {
        if (confirm(`¿Quieres desmarcar TODAS las actividades tachadas de las 4 semanas?`)) {
            for (let w = 1; w <= TOTAL_WEEKS; w++) {
                appData.weeks[w].forEach(task => task.completed = false);
            }
            saveData();
            renderTasks();
        }
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Actualización continua del timer en tiempo real
    setInterval(updateUserSection, 60000);

    loadData();
    renderTasks();
</script>

</body>
</html>
